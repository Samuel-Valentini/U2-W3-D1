<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>U2-W3-D1</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous" />
    </head>
    <body class="bg-secondary text-white fw-bold">
        <div class="container">
            <div class="row">
                <div class="col col-12">
                    <form id="formA">
                        <div class="mb-3">
                            <label for="petName" class="form-label"
                                >Nome dell'animale domestico</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="petName"
                                aria-describedby="petName" />
                            <div class="form-text">Il nome del tuo animale</div>
                        </div>
                        <div class="mb-3">
                            <label for="ownerName" class="form-label"
                                >Nome del proprietario</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="ownerName"
                                aria-describedby="ownerName" />
                            <div class="form-text">Il tuo nome</div>
                        </div>
                        <div class="mb-3">
                            <label for="species" class="form-label"
                                >Tipo di animale domestico (cane, gatto,
                                camaleonte, ecc...)</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="species"
                                aria-describedby="species" />
                            <div class="form-text">Il tipo di animale</div>
                        </div>
                        <div class="mb-3">
                            <label for="breed" class="form-label"
                                >Razza dell'animale domestico</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="breed"
                                aria-describedby="breed" />
                            <div class="form-text">
                                La razza del tuo animale
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            Registra
                        </button>
                    </form>
                </div>
                <div class="col col-12 mt-3">
                    <table class="table text-center">
                        <thead>
                            <tr>
                                <th scope="col">Nome</th>
                                <th scope="col">Proprietario</th>
                                <th scope="col">Tipo</th>
                                <th scope="col">Razza</th>
                            </tr>
                        </thead>
                        <tbody class="fw-normal" id="tableA"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <script src="./assets/script/script.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    </body>
</html>
